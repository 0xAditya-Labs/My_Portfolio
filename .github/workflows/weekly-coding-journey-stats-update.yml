name: Daily Coding Journey Stats Update

on:
  schedule:
    - cron: "30 18 * * *" # daily (18:30 UTC = 00:00 IST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run script
        run: node scripts/fetch-coding_journey-stats.mjs

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update Coding Journey stats [skip ci]"
          file_pattern: "public/coding-journey-stats.json"
